      - ".github/workflows/ghostty-vt-artifact.yml"
      - ".github/workflows/ios-release-hardening.yml"
      - "Cargo.lock"
      - "package.json"
      - "apple/GhostteaKit/Compatibility/ios-release.cdx.json"
      - "apple/GhostteaKit/Compatibility/ios-release-resources.lock.json"
      - "apple/GhostteaKit/Compatibility/ios-app-store.lock.json"
      - "apple/GhostteaKit/Compatibility/ios-rust-components.lock.json"
      - "apple/GhostteaKit/Compatibility/ios-toolchain.lock.json"
      - "apple/GhostteaKit/Compatibility/ghostty-upgrade-procedure.md"
      - "apple/GhostteaKit/Compatibility/apple-native-artifact.lock.json"
      - "apple/GhostteaApp/Resources/**"
      - "apple/GhostteaApp/App/**"
      - "apple/GhostteaApp/GhostteaApp.xcodeproj/project.pbxproj"
      - "apple/GhostteaKit/Package.swift"
      - "Package.swift"
      - "apple/GhostteaKit/Sources/GhostteaFontProof/Resources/Fonts/**"
      - "apple/GhostteaKit/Sources/GhostteaDiagnostics/**"
      - "apple/GhostteaKit/Sources/GhostteaTerminal/**"
      - "apple/GhostteaKit/Tests/GhostteaDiagnosticsTests/**"
      - "apple/GhostteaKit/Compatibility/truffle-swift.lock.json"
      - "native/fonts.lock.json"
      - "native/ghostty.lock.json"
      - "native/ghosttea/crates/ghosttea-vt-sys/artifacts.json"
      - "native/ssh.lock.json"
      - "scripts/archive-ios-app.mjs"
      - "scripts/bootstrap-ghostty-vt-apple.mjs"
      - "scripts/bootstrap-ghostty-vt.mjs"
      - "scripts/build-ghostty-vt-apple.mjs"
      - "scripts/build-ghostty-vt.mjs"
      - "scripts/check-apple-native-artifact.mjs"
      - "scripts/check-bundled-fonts.mjs"
      - "scripts/ghosttea-apple-native-artifact.mjs"
      - "scripts/package-ghosttea-apple-native.mjs"
      - "scripts/check-ios-release-bom.mjs"
      - "scripts/check-ios-release-resources.mjs"
      - "scripts/check-ios-app-store-readiness.mjs"
      - "scripts/check-ios-redacted-diagnostics.mjs"
      - "scripts/check-ghostty-upgrade-procedure.mjs"
      - "scripts/check-ios-release-ready.mjs"
      - "scripts/update-ios-release-resources.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ghostty-vt-artifact.yml"
      - ".github/workflows/ios-release-hardening.yml"
      - "Cargo.lock"
      - "package.json"
      - "apple/GhostteaKit/Compatibility/ios-release.cdx.json"
      - "apple/GhostteaKit/Compatibility/ios-release-resources.lock.json"
      - "apple/GhostteaKit/Compatibility/ios-app-store.lock.json"
      - "apple/GhostteaKit/Compatibility/ios-rust-components.lock.json"
      - "apple/GhostteaKit/Compatibility/ios-toolchain.lock.json"
      - "apple/GhostteaKit/Compatibility/ghostty-upgrade-procedure.md"
      - "apple/GhostteaKit/Compatibility/apple-native-artifact.lock.json"
      - "apple/GhostteaApp/Resources/**"
      - "apple/GhostteaApp/App/**"
      - "apple/GhostteaApp/GhostteaApp.xcodeproj/project.pbxproj"
      - "apple/GhostteaKit/Package.swift"
      - "Package.swift"
      - "apple/GhostteaKit/Sources/GhostteaFontProof/Resources/Fonts/**"
      - "apple/GhostteaKit/Sources/GhostteaDiagnostics/**"
      - "apple/GhostteaKit/Sources/GhostteaTerminal/**"
      - "apple/GhostteaKit/Tests/GhostteaDiagnosticsTests/**"
      - "apple/GhostteaKit/Compatibility/truffle-swift.lock.json"
      - "native/fonts.lock.json"
      - "native/ghostty.lock.json"
      - "native/ghosttea/crates/ghosttea-vt-sys/artifacts.json"
      - "native/ssh.lock.json"
      - "scripts/archive-ios-app.mjs"
      - "scripts/bootstrap-ghostty-vt-apple.mjs"
      - "scripts/bootstrap-ghostty-vt.mjs"
      - "scripts/build-ghostty-vt-apple.mjs"
      - "scripts/build-ghostty-vt.mjs"
      - "scripts/check-apple-native-artifact.mjs"
      - "scripts/check-bundled-fonts.mjs"
      - "scripts/ghosttea-apple-native-artifact.mjs"
      - "scripts/package-ghosttea-apple-native.mjs"
      - "scripts/check-ios-release-bom.mjs"
      - "scripts/check-ios-release-resources.mjs"
      - "scripts/check-ios-app-store-readiness.mjs"
      - "scripts/check-ios-redacted-diagnostics.mjs"
      - "scripts/check-ghostty-upgrade-procedure.mjs"
      - "scripts/check-ios-release-ready.mjs"
      - "scripts/update-ios-release-resources.mjs"

permissions:
  contents: read

jobs:
  validate-bom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run check:ghostty-upgrade
      - run: npm run check:bundled-fonts
      - run: npm run check:ios-release-bom
      - run: npm run check:ios-release-resources
      - run: npm run check:ios-app-store
      - run: npm run check:ios-diagnostics

      - name: Validate with the official CycloneDX CLI
        uses: docker://cyclonedx/cyclonedx-cli:0.32.0
        with:
          args: >-
            validate
            --input-file apple/GhostteaKit/Compatibility/ios-release.cdx.json
            --input-format json
            --input-version v1_6
            --fail-on-errors

      - name: Preserve validated iOS release metadata
        uses: actions/upload-artifact@v7
        with:
          name: ghosttea-ios-release-metadata
          path: |
            apple/GhostteaApp/Resources/Ghosttea-iOS.cdx.json
            apple/GhostteaApp/Resources/THIRD-PARTY-NOTICES.txt
            apple/GhostteaKit/Compatibility/ios-release-resources.lock.json
            apple/GhostteaKit/Compatibility/ios-toolchain.lock.json
            apple/GhostteaKit/Compatibility/ios-app-store.lock.json
            apple/GhostteaKit/Compatibility/TailscaleKit-PrivacyInfo.xcprivacy
            apple/GhostteaKit/Compatibility/app-store-review-notes.md
            apple/GhostteaApp/Resources/PrivacyInfo.xcprivacy
          if-no-files-found: error

  # The root manifest publishes GhostteaKit and the local one builds it; they are
  # mirrors apart from how the native artifact is sourced. Comparing the two
  # package graphs needs a Swift toolchain to evaluate them, so it runs here
  # rather than on the Linux BOM job, where the check would silently skip.
  validate-package-manifests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # --release, not the offline form. This job's path filters include the
      # artifact lock and both manifests, so it runs on exactly the changes that
      # can repoint the binary target — which is where the published bytes are
      # worth fetching and hashing, before the change merges rather than after.
      # The offline form would only check that the lock agrees with itself and
      # with a local artifact that does not exist on a runner.
      - run: npm run check:apple-native-artifact:release

      # Resolution is the artifact-specific assertion: SwiftPM enforces the
      # committed manifest's checksum before unpacking, so this fails if the
      # published artifact and the pin disagree — which is exactly what a consumer
      # would hit.
      #
      # Deliberately not `swift build`. Compiling the Swift package is a separate
      # concern from whether the artifact resolves, and gating it here means an
      # unrelated toolchain difference reads as an artifact failure — it did on the
      # first run, where GhostteaPerformance's generic `measure` tripped a
      # non-Sendable diagnostic that this runner's Swift raises and newer Swift
      # does not. Nothing is lost by leaving it out: the check above proves the
      # published bytes are byte-identical to the artifact that was composed and
      # built against locally, so a compile here would compile the same bytes.
      - name: Prove SwiftPM resolves against the published artifact
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: swift package resolve
