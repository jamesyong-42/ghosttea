name: Desktop release gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    env:
      GHOSTTEA_SOAK_SESSIONS: ${{ github.event_name == 'schedule' && '1024' || '256' }}
      GHOSTTEA_SOAK_ROUNDS: ${{ github.event_name == 'schedule' && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt:apple
      - run: npm run ci:desktop

  # Windows runs the same release gate as macOS. It bootstraps the Ghostty VT
  # artifact from the pinned source rather than the Apple prebuild, which is
  # also how a Windows contributor works today.
  windows:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GHOSTTEA_SOAK_SESSIONS: ${{ github.event_name == 'schedule' && '1024' || '256' }}
      GHOSTTEA_SOAK_ROUNDS: ${{ github.event_name == 'schedule' && '4' || '1' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The FFI gate compiles its C11 header probe with clang, which the
      # GitHub-hosted image exposed on PATH. This image ships LLVM 20 under
      # C:\Program Files\LLVM but leaves it off PATH and without the `clang`
      # entry point on disk. clang++.exe is the same driver binary selecting
      # its mode from argv[0], so a copy named clang.exe is the C driver.
      - name: Put clang on PATH
        run: |
          llvm='/c/Program Files/LLVM/bin'
          [ -x "$llvm/clang.exe" ] || cp "$llvm/clang++.exe" "$llvm/clang.exe"
          echo "$llvm" >> "$GITHUB_PATH"

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - run: npm run build:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - run: npm run ci:desktop

  minimum-rust:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - run: cargo check --workspace --all-targets --all-features --locked

  dependency-audit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
