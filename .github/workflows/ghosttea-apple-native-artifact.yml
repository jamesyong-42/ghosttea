name: Ghosttea Apple native artifact

# Audits the XCFramework that GhostteaKit's URL binary target resolves. It does
# not build or publish it.
#
# The tag is content-addressed (`ghosttea-apple-native-<digest12>`), not keyed to
# a ghosttea release: `.binaryTarget(url:checksum:)` needs a checksum that is
# already valid at the commit SwiftPM resolves, and release assets are built
# after their release commit. Publishing once per distinct artifact means every
# later ghosttea tag points at bytes that already exist.
#
# This workflow used to build the artifact in CI and refuse to publish unless the
# rebuild reproduced the digest the tag names. That cannot work, for two reasons
# discovered when it first ran:
#
#   1. The Apple build is not byte-reproducible. Measured, not assumed:
#      recomposing identical sources on one machine with one toolchain moved the
#      archive by two bytes and changed its content digest. A rebuild can
#      therefore never match a digest computed elsewhere, so "rebuild and
#      compare" fails by construction.
#   2. It triggered on the artifact tag and checked out that tag. The artifact is
#      published before the lock update merges — it has to be, since the lock
#      records the URL — so the tree at that tag still names the previous
#      artifact. The comparison was guaranteed to disagree.
#
# The build stays local, where `npm run` already does it. Nothing is lost by that:
# SwiftPM verifies the checksum from the *committed* manifest before unpacking, so
# an asset cannot be substituted without editing a reviewed file, which is the
# guarantee an attestation over CI-built bytes would have added.
#
# What is actually worth automating is the opposite direction — confirming that
# the bytes consumers will fetch are still the bytes the lock names. Any PR
# touching the lock or either manifest gets that from `iOS release hardening`;
# this runs the same check on a schedule, because the artifact is an external
# dependency of every GhostteaKit consumer and a deleted or altered release would
# otherwise surface as a stranger's failed build.

on:
  workflow_dispatch:
  schedule:
    # Weekly. The artifact changes rarely; this is watching for it disappearing,
    # not for it changing.
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      # Fetches the locked URL, checks the archive's size and SHA-256, unpacks it,
      # and re-derives the content digest and every slice digest from the bytes
      # actually served. Also asserts the artifact was built from the native
      # sources in this checkout.
      - name: Verify the published artifact against its lock
        run: npm run check:apple-native-artifact:release

      # The check proves the bytes are right. This proves SwiftPM accepts them:
      # resolution enforces the manifest's checksum before unpacking, and the
      # build proves the slices link.
      - name: Prove SwiftPM resolves and builds against it
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          swift package resolve
          swift build --target GhostteaCore
