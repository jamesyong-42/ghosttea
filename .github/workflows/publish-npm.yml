name: Publish npm packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-audit:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  validate:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Require the package version to match the tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run ci:desktop

  publish:
    needs:
      - rust-audit
      - validate
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require the package version to match the tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci --ignore-scripts
      - run: npm run build:sdk

      - name: Publish protocol
        run: npm publish --workspace @vibecook/ghosttea-protocol --access public --provenance

      - name: Publish frame transport
        run: npm publish --workspace @vibecook/ghosttea-frame --access public --provenance

      - name: Publish client
        run: npm publish --workspace @vibecook/ghosttea --access public --provenance

      - name: Publish Node control client
        run: npm publish --workspace @vibecook/ghosttea-client --access public --provenance

      - name: Publish Electron integration
        run: npm publish --workspace @vibecook/ghosttea-electron --access public --provenance

      - name: Publish React integration
        run: npm publish --workspace @vibecook/ghosttea-react --access public --provenance
