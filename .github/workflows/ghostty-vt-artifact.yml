name: Ghostty VT artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "ghostty-vt-*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt
      - run: npm run build:ghostty-vt

      - name: Upload unstripped build
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-vt-unstripped
          path: native/build/ghostty/install/
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Download unstripped build
        uses: actions/download-artifact@v8
        with:
          name: ghostty-vt-unstripped
          path: native/build/ghostty/install/

      - run: npm run normalize:ghostty-vt
      - name: Package locked release artifact
        if: github.ref_type == 'tag'
        run: npm run package:ghostty-vt

      - name: Package diagnostic candidate
        if: github.ref_type != 'tag'
        run: npm run package:ghostty-vt -- --allow-mismatch

      - name: Require the release tag to match the locked artifact
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="$(node -p "require('./native/terminald/crates/ghostty-vt-sys/artifacts.json').targets['aarch64-apple-darwin'].release")"
          test "$RELEASE_TAG" = "$expected"

      - name: Resolve locked artifact paths
        id: ghostty_artifact
        run: |
          filename="$(node -p "require('./native/terminald/crates/ghostty-vt-sys/artifacts.json').targets['aarch64-apple-darwin'].filename")"
          echo "path=artifacts/ghostty-vt/$filename" >> "$GITHUB_OUTPUT"
          echo "sbom=artifacts/ghostty-vt/$filename.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ghostty_artifact.outputs.path }}

      - name: Attest bundle SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ghostty_artifact.outputs.path }}
          sbom-path: ${{ steps.ghostty_artifact.outputs.sbom }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-vt-aarch64-apple-darwin
          path: artifacts/ghostty-vt/
          if-no-files-found: error

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/ghostty-vt/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
