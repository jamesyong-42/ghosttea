name: Ghostty VT artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "ghostty-vt-*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt -- --target=aarch64-apple-darwin
      - run: npm run build:ghostty-vt -- --target=aarch64-apple-darwin

      - name: Upload unstripped build
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-vt-unstripped
          path: native/build/ghostty/aarch64-apple-darwin/install/
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Download unstripped build
        uses: actions/download-artifact@v8
        with:
          name: ghostty-vt-unstripped
          path: native/build/ghostty/aarch64-apple-darwin/install/

      - run: npm run normalize:ghostty-vt -- --target=aarch64-apple-darwin
      - name: Package locked release artifact
        if: github.ref_type == 'tag'
        run: npm run package:ghostty-vt -- --target=aarch64-apple-darwin

      - name: Package diagnostic candidate
        if: github.ref_type != 'tag'
        run: npm run package:ghostty-vt -- --target=aarch64-apple-darwin --allow-mismatch

      - name: Require the release tag to match the locked artifact
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="$(node -p "require('./native/ghosttea/crates/ghosttea-vt-sys/artifacts.json').targets['aarch64-apple-darwin'].release")"
          test "$RELEASE_TAG" = "$expected"

      - name: Resolve produced artifact paths
        id: ghostty_artifact
        run: |
          filename="$(node scripts/ghostty-vt-artifact-name.mjs --target=aarch64-apple-darwin)"
          echo "path=artifacts/ghostty-vt/$filename" >> "$GITHUB_OUTPUT"
          echo "sbom=artifacts/ghostty-vt/$filename.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Attest bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ghostty_artifact.outputs.path }}

      - name: Attest bundle SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ghostty_artifact.outputs.path }}
          sbom-path: ${{ steps.ghostty_artifact.outputs.sbom }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-vt-aarch64-apple-darwin
          path: artifacts/ghostty-vt/
          if-no-files-found: error

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/ghostty-vt/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  # Windows builds natively: Zig cannot target the MSVC ABI from the Linux
  # builder image because Microsoft's CRT headers and import libraries are not
  # redistributable. The runner's bytes are therefore authoritative, and the
  # locked manifest is updated from this job's output rather than compared
  # against it. See native/ghosttea/crates/ghosttea-vt-sys/README.md.
  windows:
    needs: package
    runs-on: blacksmith-4vcpu-windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run bootstrap:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - run: npm run build:ghostty-vt -- --target=x86_64-pc-windows-msvc
      - run: npm run package:ghostty-vt -- --target=x86_64-pc-windows-msvc --allow-mismatch

      - name: Resolve produced artifact paths
        id: ghostty_artifact
        run: |
          filename="$(node scripts/ghostty-vt-artifact-name.mjs --target=x86_64-pc-windows-msvc)"
          echo "path=artifacts/ghostty-vt/$filename" >> "$GITHUB_OUTPUT"
          echo "sbom=artifacts/ghostty-vt/$filename.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Report the manifest entry to lock
        run: |
          filename="$(node scripts/ghostty-vt-artifact-name.mjs --target=x86_64-pc-windows-msvc)"
          {
            echo '### Windows artifact produced by this run'
            echo
            echo 'Copy into `targets["x86_64-pc-windows-msvc"]` of artifacts.json:'
            echo '```json'
            cat "artifacts/ghostty-vt/$filename.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest bundle provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ghostty_artifact.outputs.path }}

      - name: Attest bundle SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.ghostty_artifact.outputs.path }}
          sbom-path: ${{ steps.ghostty_artifact.outputs.sbom }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghostty-vt-x86_64-pc-windows-msvc
          path: artifacts/ghostty-vt/
          if-no-files-found: error

      # Deliberately no --clobber. A native build is not reproducible, so the
      # published bytes are the ones artifacts.json is locked against; replacing
      # them would leave every consumer's checksum check failing. A re-run for a
      # release that already carries this asset should fail here and be resolved
      # by cutting a new release, not by overwriting one.
      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" artifacts/ghostty-vt/* \
            --repo "$GITHUB_REPOSITORY"
