appId: com.vibecook.ghosttea
productName: Ghosttea
asar: true
directories:
  output: ../../dist
files:
  - out/**
  - package.json
# Copy the directory rather than one filename: `stage:ghosttead` writes
# `ghosttead` or `ghosttead.exe` depending on the host, and the main process
# looks for the matching name under `Resources/bin`.
extraResources:
  - from: build/bin
    to: bin
mac:
  category: public.app-category.developer-tools
  extraResources:
    - from: native/build/Release/ghosttea_native_tabs.node
      to: native/ghosttea_native_tabs.node
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  # The native tab helper is macOS-only, so Windows ships only the app and the
  # staged terminal service from the shared extraResources above.
  target:
    - nsis
    - zip
artifactName: ${productName}-${version}-${arch}.${ext}
