appId: com.vibecook.ghosttea
productName: Ghosttea
asar: true
directories:
  output: ../../dist
files:
  - out/**
  - package.json
extraResources:
  - from: build/bin/ghosttead
    to: bin/ghosttead
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
artifactName: ${productName}-${version}-${arch}.${ext}
