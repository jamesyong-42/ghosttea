[workspace]
resolver = "2"
members = [
  "native/ghosttead",
  "native/terminald",
  "native/terminald/crates/ghosttea-core",
  "native/terminald/crates/font-fixture-ffi",
  "native/terminald/crates/ghostty-adapter",
  "native/terminald/crates/ghostty-vt-sys",
  "native/terminald/crates/text-engine",
  "native/terminald/crates/truffle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["James Yong"]
license = "MIT"
repository = "https://github.com/jamesyong-42/ghosttea"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15"
subtle = "2"
tempfile = "3.20"
tokio = { version = "1.45", features = ["full"] }
uuid = { version = "1.16", features = ["v4"] }
truffle-core = "0.7.2"

# Development uses the sibling Truffle checkout while published manifests keep
# a normal registry dependency. Remove this patch once the registry release is
# the default development source as well.
[patch.crates-io]
truffle-core = { path = "../p008/truffle/crates/truffle-core" }
