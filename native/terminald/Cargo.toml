[package]
name = "terminald"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
portable-pty = "0.9"
ghostty-adapter = { path = "crates/ghostty-adapter" }
text-engine = { path = "crates/text-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
uuid = { version = "1.16", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"
