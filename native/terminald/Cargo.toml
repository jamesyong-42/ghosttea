[package]
name = "ghosttea"
version = "0.1.0"
edition = "2024"
description = "A native Ghostty-powered terminal runtime for Electron applications"
repository = "https://github.com/jamesyong-42/ghosttea"

[[bin]]
name = "ghosttead"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
portable-pty = "0.9"
ghosttea-vt = { path = "crates/ghostty-adapter" }
ghosttea-text = { path = "crates/text-engine" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
uuid = { version = "1.16", features = ["v4"] }
dotenvy = "0.15"
truffle-core = { path = "../../../p008/truffle/crates/truffle-core" }
subtle = "2"

[dev-dependencies]
tempfile = "3.20"
