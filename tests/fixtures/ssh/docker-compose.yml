services:
  sshd:
    build:
      context: .
    init: true
    ports:
      - "${GHOSTTEA_SSH_PASSWORD_BIND_ADDRESS:-127.0.0.1}:${GHOSTTEA_SSH_PASSWORD_PORT:-22022}:22022"
      - "127.0.0.1:${GHOSTTEA_SSH_KEYBOARD_PORT:-22023}:22023"
      - "127.0.0.1:${GHOSTTEA_SSH_PARTIAL_PORT:-22024}:22024"
      - "${GHOSTTEA_SSH_PUBLIC_KEY_BIND_ADDRESS:-127.0.0.1}:${GHOSTTEA_SSH_PUBLIC_KEY_PORT:-22025}:22025"
      - "127.0.0.1:${GHOSTTEA_SSH_BLACKHOLE_PORT:-22026}:22026"
      - "127.0.0.1:${GHOSTTEA_SSH_ECDSA_AESGCM_PORT:-22027}:22027"
      - "127.0.0.1:${GHOSTTEA_SSH_RSA_SHA2_PORT:-22028}:22028"
      - "${GHOSTTEA_SSH_KEYBOARD_METADATA_BIND_ADDRESS:-127.0.0.1}:${GHOSTTEA_SSH_KEYBOARD_METADATA_PORT:-22029}:22029"
    volumes:
      - type: bind
        source: ${GHOSTTEA_SSH_FIXTURE_PUBLIC_KEY:?set by scripts/ssh-fixture.mjs}
        target: /fixture/authorized_keys
        read_only: true
